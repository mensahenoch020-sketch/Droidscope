plugins { id 'com.android.application' }

android {
    namespace 'com.droidscope.companion'
    compileSdk 35

    defaultConfig {
        applicationId 'com.droidscope.companion'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'DEFAULT_SERVER_URL', '"https://droidscope-production.up.railway.app"'
    }

    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
